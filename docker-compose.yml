version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ftt_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_truth_teller
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ftt_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    container_name: ftt_ml
    volumes:
      - ml_models:/ml/models
    profiles:
      - ml

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ftt_backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/food_truth_teller
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ML_MODEL_PATH: /ml/models/health_model.pkl
      ML_VECTORIZER_PATH: /ml/models/vectorizer.pkl
    volumes:
      - ml_models:/ml/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models:
